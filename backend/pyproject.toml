[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "migrations",
    "venv",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "DJ",   # flake8-django
    "SIM",  # flake8-simplify
]
ignore = [
    "DJ008",  # __str__ is enforced case-by-case, not worth a blanket rule
]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]
"**/__init__.py" = ["F401"]  # re-exports (models/serializers/views __init__ files)
"config/settings.py" = ["F405", "F403"]

[tool.ruff.lint.isort]
known-first-party = ["config", "core"]
section-order = ["future", "standard-library", "third-party", "django", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
django = ["django", "rest_framework"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
